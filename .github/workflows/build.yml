name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "pyinstaller<7.0"
          pip install ruff
      - name: Lint and compile check
        run: |
          ruff check .
          python3 -m compileall core ui models
      - name: Build with PyInstaller
        run: pyinstaller build_win.spec
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: CodeMaster-windows
          path: dist/CodeMaster.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "pyinstaller<7.0"
          pip install ruff
      - name: Lint and compile check
        run: |
          ruff check .
          python3 -m compileall core ui models
      - name: Build with PyInstaller
        run: pyinstaller build_mac.spec
      - name: Create DMG
        run: hdiutil create -volname "CodeMaster" -srcfolder dist/CodeMaster.app -ov -format UDZO dist/CodeMaster.dmg
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v5
        with:
          name: CodeMaster-macos
          path: dist/CodeMaster.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev binutils
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install "pyinstaller<7.0"
          pip install ruff pip-audit
      - name: Dependency security audit
        run: pip-audit -r requirements.txt
      - name: Lint and compile check
        run: |
          ruff check .
          python3 -m compileall core ui models
      - name: Build with PyInstaller
        run: pyinstaller build_linux.spec
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v5
        with:
          name: CodeMaster-linux
          path: dist/CodeMaster

  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Build firmware
        run: |
          make -C firmware/application
          make -C firmware/bootloader
          cc -I firmware/application/tests/stubs -I firmware/application/Inc \
            firmware/application/tests/test_trigger_flash.c \
            -o /tmp/test_trigger_flash
          /tmp/test_trigger_flash
          cc -I firmware/application/tests/stubs -I firmware/application/Inc \
            firmware/application/tests/test_device_config.c \
            -o /tmp/test_device_config
          /tmp/test_device_config
      - name: Verify application metadata
        run: |
          python3 -m pip install intelhex
          python3 firmware/tools/add_app_metadata.py \
            firmware/application/build/codemaster_app.raw.hex \
            /tmp/codemaster_app_checked.hex
      - name: Collect firmware artifacts
        run: |
          mkdir firmware-artifacts
          cp firmware/application/build/codemaster_app.hex firmware-artifacts/
          cp firmware/application/build/codemaster_app.bin firmware-artifacts/
          cp firmware/bootloader/build/codemaster_bootloader.hex firmware-artifacts/
          cp firmware/bootloader/build/codemaster_bootloader.bin firmware-artifacts/
          (cd firmware-artifacts && sha256sum * > SHA256SUMS.txt)
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v5
        with:
          name: CodeMaster-firmware
          path: firmware-artifacts

  release:
    needs: [build-windows, build-macos, build-linux, build-firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    steps:
      - name: Determine release info
        id: release_info
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "release_name=Release $TAG_NAME" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "tag_name=latest" >> $GITHUB_OUTPUT
            echo "release_name=Latest build" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Rename artifacts for release
        run: |
          mkdir dist
          mv artifacts/CodeMaster-windows/CodeMaster.exe dist/CodeMaster.exe
          mv artifacts/CodeMaster-macos/CodeMaster.dmg dist/CodeMaster.dmg
          mv artifacts/CodeMaster-linux/CodeMaster dist/CodeMaster
          cp artifacts/CodeMaster-firmware/* dist/
          chmod +x dist/CodeMaster
      - name: Create/Update latest release
        if: steps.release_info.outputs.is_tag == 'false'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest
          name: Latest build
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            dist/CodeMaster.exe
            dist/CodeMaster.dmg
            dist/CodeMaster
            dist/codemaster_app.hex
            dist/codemaster_app.bin
            dist/codemaster_bootloader.hex
            dist/codemaster_bootloader.bin
            dist/SHA256SUMS.txt
      - name: Create versioned release
        if: steps.release_info.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          prerelease: false
          files: |
            dist/CodeMaster.exe
            dist/CodeMaster.dmg
            dist/CodeMaster
            dist/codemaster_app.hex
            dist/codemaster_app.bin
            dist/codemaster_bootloader.hex
            dist/codemaster_bootloader.bin
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
