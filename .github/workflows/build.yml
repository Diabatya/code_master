name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "pyinstaller<7.0"
          pip install ruff
      - name: Lint and compile check
        run: |
          ruff check .
          python3 -m compileall core ui models
      - name: Generate version_info.py from models/version.py
        run: python tools/generate_version_info.py
      - name: Build with PyInstaller
        run: pyinstaller build_win.spec
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: CodeMaster-windows
          path: dist/CodeMaster.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "pyinstaller<7.0"
          pip install ruff
      - name: Lint and compile check
        run: |
          ruff check .
          python3 -m compileall core ui models
      - name: Build with PyInstaller
        run: pyinstaller build_mac.spec
      - name: Create DMG
        run: hdiutil create -volname "CodeMaster" -srcfolder dist/CodeMaster.app -ov -format UDZO dist/CodeMaster.dmg
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v5
        with:
          name: CodeMaster-macos
          path: dist/CodeMaster.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev binutils
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install "pyinstaller<7.0"
          pip install ruff pip-audit
      - name: Dependency security audit
        run: pip-audit -r requirements.txt
      - name: Lint and compile check
        run: |
          ruff check .
          python3 -m compileall core ui models
      - name: Build with PyInstaller
        run: pyinstaller build_linux.spec
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v5
        with:
          name: CodeMaster-linux
          path: dist/CodeMaster

  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Install firmware build dependencies
        run: python3 -m pip install intelhex
      - name: Build firmware
        run: |
          make -C firmware/application
          make -C firmware/bootloader
          cc -I firmware/application/tests/stubs -I firmware/application/Inc \
            firmware/application/tests/test_trigger_flash.c \
            -o /tmp/test_trigger_flash
          /tmp/test_trigger_flash
          cc -I firmware/application/tests/stubs -I firmware/application/Inc \
            firmware/application/tests/test_device_config.c \
            -o /tmp/test_device_config
          /tmp/test_device_config
      - name: Verify application metadata
        run: |
          python3 -m pip install intelhex
          python3 firmware/tools/add_app_metadata.py \
            firmware/application/build/codemaster_app.raw.hex \
            /tmp/codemaster_app_checked.hex
      - name: Collect firmware artifacts
        run: |
          # Два образа по отчёту мастера:
          #  «2 CAN DFU» — полный образ (bootloader + данные устройства +
          #    метаданные + application) для первичной прошивки через DFU;
          #  «2 CAN CDC» — только application + данные устройства/метаданные
          #    для кнопки «Обновить» на устройствах с загрузчиком.
          # --version проставляет номер релиза в версионную запись VER1
          # страницы данных устройства (0x08008000).
          mkdir firmware-artifacts
          FW_VERSION=$(python3 -c "import re; print(re.search(r'VERSION = \"([^\"]+)\"', open('models/version.py').read()).group(1))")
          python3 firmware/tools/make_full_image.py \
            firmware/bootloader/build/codemaster_bootloader.hex \
            firmware/application/build/codemaster_app.hex \
            firmware-artifacts/codemaster_full.hex \
            firmware-artifacts/codemaster_full.bin \
            --cdc-hex firmware-artifacts/codemaster_app_cdc.hex \
            --cdc-bin firmware-artifacts/codemaster_app_cdc.bin \
            --version "$FW_VERSION"
          (cd firmware-artifacts && sha256sum * > SHA256SUMS.txt)
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v5
        with:
          name: CodeMaster-firmware
          path: firmware-artifacts

  release:
    needs: [build-windows, build-macos, build-linux, build-firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - name: Determine release info
        id: release_info
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "release_name=Release $TAG_NAME" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "tag_name=latest" >> $GITHUB_OUTPUT
            echo "release_name=Latest build" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi
          # Версия релиза — из models/version.py: она же прошивается
          # в МК (VER1 в полном образе, отчёт мастера).
          VER=$(python3 -c "import re; print(re.search(r'VERSION = \"([^\"]+)\"', open('models/version.py').read()).group(1))")
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Rename artifacts for release
        run: |
          mkdir dist
          VER="${{ steps.release_info.outputs.version }}"
          # Имена по отчёту мастера: приложение «CODMaster (ver)»,
          # прошивка «CAN 2 (ver)» — ver = версия релиза, она же
          # зашита в МК.
          mv artifacts/CodeMaster-windows/CodeMaster.exe "dist/CODMaster ($VER).exe"
          mv artifacts/CodeMaster-macos/CodeMaster.dmg "dist/CODMaster ($VER).dmg"
          mv artifacts/CodeMaster-linux/CodeMaster "dist/CODMaster ($VER)"
          # Две прошивки по отчёту мастера: «2 CAN DFU» — полный образ
          # для первичной прошивки, «2 CAN CDC» — application для
          # обновления кнопкой «Обновить» (загрузчик уже на плате).
          mv artifacts/CodeMaster-firmware/codemaster_full.hex "dist/2 CAN DFU ($VER).hex"
          mv artifacts/CodeMaster-firmware/codemaster_full.bin "dist/2 CAN DFU ($VER).bin"
          mv artifacts/CodeMaster-firmware/codemaster_app_cdc.hex "dist/2 CAN CDC ($VER).hex"
          mv artifacts/CodeMaster-firmware/codemaster_app_cdc.bin "dist/2 CAN CDC ($VER).bin"
          chmod +x "dist/CODMaster ($VER)"
          # Контрольные суммы — уже под финальными именами файлов.
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Create/Update latest release
        id: release_latest
        if: steps.release_info.outputs.is_tag == 'false'
        continue-on-error: true
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest
          name: Latest build
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            dist/*
      - name: Fallback release upload (gh CLI)
        if: steps.release_latest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for i in 1 2 3; do
              gh release create latest --repo "$GITHUB_REPOSITORY" \
                --title "Latest build" --prerelease --target "${GITHUB_SHA}" && break
              [ "$i" = 3 ] && exit 1
              sleep 15
            done
          fi
          for i in 1 2 3; do
            gh release upload latest dist/* --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            [ "$i" = 3 ] && exit 1
            sleep 15
          done
      - name: Create versioned release
        if: steps.release_info.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          prerelease: false
          files: |
            dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
